services:
  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    networks:
      - comm-net
    develop:
      watch:
        - action: sync
          path: ./user_service/app
          target: /app/app
        - action: rebuild
          path: ./user_service/requirements.txt

  product-service:
    build:
      context: ./product_service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    networks:
      - comm-net
    develop:
      watch:
        - action: sync
          path: ./product_service/app
          target: /app/app
        - action: rebuild
          path: ./product_service/requirements.txt

  order-service:
    build:
      context: order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    networks:
      - comm-net
    env_file: ./order_service/.env
    depends_on:
      - timescaledb
      - rabbitmq
    develop:
      watch:
        - action: sync
          path: ./order_service/app
          target: /app/app
        - action: rebuild
          path: ./order_service/requirements.txt

  timescaledb:
    image: timescale/timescaledb:latest-pg12
    restart: always
    container_name: timescale-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - comm-net

  rabbitmq:
    image: rabbitmq:3.7.15-management-alpine
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - comm-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - comm-net
    depends_on:
      - order-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - comm-net
    depends_on:
      - prometheus

volumes:
  timescale_data:
  grafana_data:

networks:
  comm-net:
    name: commerce-network
    driver: bridge