# The services send traces, metrics and logs here over OTLP (FastAPI's native
# telemetry plus the order service's library instrumentation). The collector
# forwards traces to Tempo and logs to Loki, and exposes metrics for Prometheus.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    # Copy these resource attributes onto every metric as labels (service_name, ...).
    resource_constant_labels:
      included:
        - service.name
        - deployment.environment.name

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
