x-otel-env: &otel-env
  # FastAPI's native OpenTelemetry support exports to the collector when this is set.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
  # Export metrics every 15s (the default is 60s) to match the Prometheus scrape interval.
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

services:
  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: user-service
    depends_on:
      - otel-collector
    ports:
      - "8081:8081"
    networks:
      - comm-net
    develop:
      watch:
        - action: sync
          path: ./user_service/app
          target: /app/app
        - action: rebuild
          path: ./user_service/requirements.txt

  product-service:
    build:
      context: ./product_service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: product-service
    depends_on:
      - otel-collector
    ports:
      - "8082:8082"
    networks:
      - comm-net
    develop:
      watch:
        - action: sync
          path: ./product_service/app
          target: /app/app
        - action: rebuild
          path: ./product_service/requirements.txt

  order-service:
    build:
      context: order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    networks:
      - comm-net
    env_file: ./order_service/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order-service
    depends_on:
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./order_service/app
          target: /app/app
        - action: rebuild
          path: ./order_service/requirements.txt

  timescaledb:
    image: timescale/timescaledb:latest-pg12
    restart: always
    container_name: timescale-db
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - comm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.7.15-management-alpine
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - comm-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - comm-net
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - comm-net

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - comm-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - comm-net
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - comm-net
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  timescale_data:
  grafana_data:

networks:
  comm-net:
    name: commerce-network
    driver: bridge